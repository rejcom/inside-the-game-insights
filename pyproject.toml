[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchsim"
version = "0.1.0"
description = "Synthetic, football-realistic match event generator and live event streamer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agents = ["agent-framework-core>=1.22", "agent-framework-foundry>=1.15", "azure-identity>=1.26", "pydantic>=2"]
dev = ["pytest>=8", "agent-framework-core>=1.22", "agent-framework-foundry>=1.15", "azure-identity>=1.26"]

[project.scripts]
matchsim = "matchsim.cli:main"
insights = "insights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webapp = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
