name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (offline: agents use their deterministic twins, no Azure access needed)
        run: pytest -q
      - name: Smoke - generate a match and run the insights pipeline offline
        run: |
          matchsim generate --scenario comeback --seed 211 --out /tmp/matches
          insights /tmp/matches/syn-comeback-* --offline --show none
